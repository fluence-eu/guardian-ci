name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

# Authenticate `bundle install` (triggered by ruby/setup-ruby's
# bundler-cache: true) against GitHub Packages so private Fluence
# gems can be fetched. Combined with `permissions: packages: read`
# on each job, the GITHUB_TOKEN gains the scope needed and Bundler
# picks the credentials up via this env.
env:
  BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Main matrix: latest stable Rails across non-coverage Rubies
          # (Ruby 4.0 / Rails latest is already exercised by
          # coverage-measure.yml + rubocop-pr.yml — no need to repeat).
          - name: Ruby 3.4 / Rails latest
            ruby: '3.4'
            gemfile: Gemfile
          - name: Ruby 3.3 / Rails latest
            ruby: '3.3'
            gemfile: Gemfile
          - name: Ruby 3.2 / Rails latest
            ruby: '3.2'
            gemfile: Gemfile
          # Rails compatibility matrix: one Ruby per Rails minor, using
          # Appraisal-generated gemfiles under gemfiles/. Keep this in
          # sync with `Appraisals`.
          - name: Ruby 3.2 / Rails 7.0
            ruby: '3.2'
            gemfile: gemfiles/rails_7.0.gemfile
          - name: Ruby 3.2 / Rails 7.1
            ruby: '3.2'
            gemfile: gemfiles/rails_7.1.gemfile
          - name: Ruby 3.2 / Rails 7.2
            ruby: '3.2'
            gemfile: gemfiles/rails_7.2.gemfile
          - name: Ruby 3.3 / Rails 8.0
            ruby: '3.3'
            gemfile: gemfiles/rails_8.0.gemfile
          - name: Ruby 3.4 / Rails 8.1
            ruby: '3.4'
            gemfile: gemfiles/rails_8.1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      # Release PRs (auto-generated by the release App on a `release/v*`
      # head branch) only carry version-bump + CHANGELOG diffs — no Ruby
      # source changes. Each step below is gated to skip in that case so
      # the matrix stays cheap, but the job still reports SUCCESS so a
      # required-status-check rule on this workflow doesn't block the
      # auto-merge of release PRs.
      - name: Skip on release PR
        if: startsWith(github.head_ref, 'release/v')
        run: echo "Release PR — matrix specs skipped (no Ruby source changes)."
      - uses: actions/checkout@v6
        if: ${{ !startsWith(github.head_ref, 'release/v') }}
      - name: Set up Ruby
        if: ${{ !startsWith(github.head_ref, 'release/v') }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        if: ${{ !startsWith(github.head_ref, 'release/v') }}
        run: bundle exec rake spec
