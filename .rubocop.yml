AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

# The gemspec has 13 add_dependency lines plus metadata — the
# block legitimately exceeds the default cap.
Metrics/BlockLength:
  Exclude:
    - 'fluence-ci-tools.gemspec'
    - 'spec/**/*'

# Bundler resolves `gem 'fluence-ci-tools'` to `lib/fluence-ci-tools.rb`,
# so the hyphenated filename is mandatory and the snake_case rule
# does not apply.
Naming/FileName:
  Exclude:
    - 'lib/fluence-ci-tools.rb'

# Step group methods in Steps catalog have a default+report branch
# each, with up to 3 step calls per branch — they intrinsically clock
# at ~14 lines. Disable the cop for this file rather than scatter
# `# rubocop:disable` directives.
Metrics/MethodLength:
  Exclude:
    - 'lib/fluence/ci/tools/steps.rb'
